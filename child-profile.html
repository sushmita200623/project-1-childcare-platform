<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Profile | Little Steps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="dashboard-nav">
    <div class="logo">🌸 Little <span>Steps</span></div>
    <a href="dashboard.html">← Dashboard</a>
</header>

<main class="page-container">

    <div class="page-heading">
        <span class="badge">👶 Child Information</span>
        <h1>Child Profile</h1>
        <p>Keep important childcare information updated.</p>
    </div>

    <div class="form-card">

        <form id="childForm">

            <div class="profile-photo-upload">
                <div class="child-avatar">👦🏻</div>
                <button type="button">Change Photo</button>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>Child Name</label>
                    <input type="text" id="childName" value="Aarav Sharma" required>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="childAge" value="4" required>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" value="2022-04-15">
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Allergies</label>
                    <textarea id="allergies" placeholder="Enter allergies">None</textarea>
                </div>

                <div class="form-group full-width">
                    <label>Special Instructions</label>
                    <textarea id="instructions"
                              placeholder="Enter special instructions">Likes drawing and story books.</textarea>
                </div>

                <div class="form-group">
                    <label>Emergency Contact Name</label>
                    <input type="text" value="Rahul Sharma">
                </div>

                <div class="form-group">
                    <label>Emergency Contact</label>
                    <input type="tel" value="+91 9876543210">
                </div>

            </div>

            <button type="submit" class="btn">Save Child Profile</button>

        </form>

        <div id="childMessage" class="success-message"></div>

    </div>

</main>

<script src="script.js"></script>
</body>
</html>
